name: Build signed release APK

# يدوي فقط: تبويب Actions ▸ Build signed release APK ▸ Run workflow.
# يبني نسخة release موقّعة بمفتاحك، بإعلانات AdMob الحقيقية (من Variables)، وينشرها في Releases.
on:
  workflow_dispatch:

permissions:
  contents: write   # لنشر الـ APK في Releases

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Locate project (unzip if only a ZIP was uploaded)
        id: proj
        shell: bash
        run: |
          set -eo pipefail
          find_settings() { find . -name settings.gradle.kts -not -path './.git/*' -not -path './_unzipped/*' -print -quit; }
          if [ -z "$(find_settings)" ]; then
            ZIP="$(find . -maxdepth 2 -iname '*.zip' -not -path './.git/*' -print -quit)"
            if [ -z "$ZIP" ]; then
              echo "::error::No Android project (settings.gradle.kts) and no .zip file found in the repository root."
              exit 1
            fi
            echo "Unzipping: $ZIP"
            mkdir -p _unzipped
            unzip -q -o "$ZIP" -d _unzipped
            SETTINGS="$(find _unzipped -name settings.gradle.kts -print -quit)"
          else
            SETTINGS="$(find_settings)"
          fi
          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle.kts not found inside the project/ZIP."
            exit 1
          fi
          DIR="$(dirname "$SETTINGS")"
          echo "Project directory: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      # تحقق مبكر: لا نبني نسخة «حقيقية» ناقصة الإعداد.
      - name: Check required secrets and variables
        shell: bash
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
          ADMOB_BANNER_UNIT_ID: ${{ vars.ADMOB_BANNER_UNIT_ID }}
        run: |
          missing=0
          for n in KS_B64 KS_PASS KEY_ALIAS KEY_PASS; do
            if [ -z "${!n}" ]; then echo "::error::Missing secret for $n (see signing-secrets.txt)"; missing=1; fi
          done
          if ! [[ "$ADMOB_APP_ID" =~ ^ca-app-pub-[0-9]{10,20}~[0-9]{5,15}$ ]]; then
            echo "::error::Variable ADMOB_APP_ID is missing or malformed (expected ca-app-pub-...~...)"; missing=1
          fi
          if ! [[ "$ADMOB_BANNER_UNIT_ID" =~ ^ca-app-pub-[0-9]{10,20}/[0-9]{5,15}$ ]]; then
            echo "::error::Variable ADMOB_BANNER_UNIT_ID is missing or malformed (expected ca-app-pub-.../...)"; missing=1
          fi
          exit $missing

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK (preinstalled on the runner)
        shell: bash
        run: |
          SDKM="$(command -v sdkmanager || true)"
          [ -n "$SDKM" ] || SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          if [ ! -d "$ANDROID_HOME/platforms/android-34" ] || [ ! -d "$ANDROID_HOME/build-tools/34.0.0" ]; then
            "$SDKM" "platforms;android-34" "build-tools;34.0.0"
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode signing key
        shell: bash
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KS_B64" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        shell: bash
        working-directory: ${{ steps.proj.outputs.dir }}
        env:
          RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
          ADMOB_BANNER_UNIT_ID: ${{ vars.ADMOB_BANNER_UNIT_ID }}
          DONATION_URL: ${{ vars.DONATION_URL }}
          PROJECT_GITHUB_URL: ${{ vars.PROJECT_GITHUB_URL }}
          PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL }}
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
        run: |
          set -o pipefail
          gradle assembleRelease --stacktrace --no-daemon 2>&1 | tee "$RUNNER_TEMP/build.log"

      # حماية: نتأكد أن النسخة ليست بإعلانات تجريبية، وأنها موقّعة فعلاً.
      - name: Verify (real ads + signature)
        shell: bash
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          set -eo pipefail
          BC="$(find app/build/generated -path '*release*' -name BuildConfig.java | head -1)"
          echo "BuildConfig: $BC"
          grep -E 'ADS_TEST_MODE|ADMOB_BANNER_UNIT_ID' "$BC"
          if grep -q 'ADS_TEST_MODE = true' "$BC"; then
            echo "::error::Release was built with TEST ads. Check ADMOB_APP_ID / ADMOB_BANNER_UNIT_ID variables."
            exit 1
          fi
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK" || { echo "::error::app-release.apk not found (signing not applied?)"; ls app/build/outputs/apk/release || true; exit 1; }
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK"

      - name: Show errors in summary
        if: failure()
        shell: bash
        run: |
          {
            echo '### Release build failed — key lines'
            echo '```'
            grep -E '^e: |error:|What went wrong|Execution failed|Could not' -A2 "$RUNNER_TEMP/build.log" | head -120 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore

      - name: Publish release APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          APK="${{ steps.proj.outputs.dir }}/app/build/outputs/apk/release/app-release.apk"
          cp "$APK" "$RUNNER_TEMP/ReoGames.apk"
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest "$RUNNER_TEMP/ReoGames.apk" \
            --target "${{ github.sha }}" \
            --title "Reo Games - latest signed APK" \
            --notes "Signed release build from commit ${{ github.sha }}"

      - name: Remove signing key from runner
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/release.jks"
